<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotpilot — project</title>
<style>
:root {
  --bg: #14161a; --panel: #1c1f24; --panel-2: #22262c; --border: #2a2e35;
  --text: #e6e3da; --dim: #8b8f98; --faint: #565b64;
  --gold: #d9a441; --fresh: #7dc98f; --stale: #e0a458; --bad: #c96f6f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 12px; cursor: pointer;
}
button:hover { border-color: var(--dim); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 1px;
}
.mono { font-family: var(--mono); font-size: 12px; }

header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px 0;
}
header h1 { font-size: 16px; font-weight: 650; letter-spacing: .04em; margin: 0; }
header h1 span { color: var(--gold); }
#totals { color: var(--dim); font-size: 13px; }
#meta { margin-left: auto; display: flex; gap: 10px; align-items: center;
        color: var(--faint); font-size: 12px; }

nav { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--border); }
nav a {
  color: var(--dim); padding: 6px 14px; border-radius: 6px 6px 0 0;
  border: 1px solid transparent; border-bottom: none; font-size: 13px;
}
nav a.active {
  color: var(--text); background: var(--panel);
  border-color: var(--border); position: relative; top: 1px;
}
nav a:hover { text-decoration: none; color: var(--text); }
nav a b { font-weight: 600; color: var(--gold); margin-left: 6px; font-size: 12px; }

main { padding: 16px 20px 60px; }
.msg { color: var(--dim); padding: 40px 0; text-align: center; }
.msg code { font-family: var(--mono); color: var(--text); }

/* ---- filters ---- */
#filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
#filters input[type=search], #filters select {
  font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
}
#filters input[type=search] { width: 260px; }
#filters .count { color: var(--faint); font-size: 12px; margin-left: auto; }

/* ---- selects gallery ---- */
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; cursor: pointer; transition: border-color .12s;
}
.card:hover { border-color: var(--dim); }
.card .ph { position: relative; aspect-ratio: 16/9; background: #0d0f12; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .missing {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--faint); font-size: 12px;
}
.card .ph .dur {
  position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.72);
  border-radius: 4px; padding: 1px 6px; font-family: var(--mono); font-size: 11px;
}
.card.reject .ph img { filter: grayscale(.9) brightness(.55); }
.card.reject .ph::after {
  content: "✗ rejected"; position: absolute; left: 6px; top: 6px;
  color: var(--bad); background: rgba(0,0,0,.72); border-radius: 4px;
  padding: 1px 6px; font-size: 11px;
}
/* signature: where the cut(s) sit inside the source file */
.ribbon { height: 4px; background: var(--border); position: relative; }
.ribbon i { position: absolute; top: 0; bottom: 0; background: var(--gold); }
.card.reject .ribbon i, .ribbon i.bad { background: var(--bad); }
/* input analyzed but nothing cut from it */
.card.skipped .ph img { filter: grayscale(.6) brightness(.8); }
.chip.warn { color: var(--stale); border-color: #4a3c1e; }
.card .body { padding: 8px 10px 10px; }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .label { font-weight: 600; }
.stars { color: var(--gold); font-size: 12px; letter-spacing: 2px; white-space: nowrap; }
.stars .off { color: var(--faint); }
.card .src { color: var(--dim); font-family: var(--mono); font-size: 11px; margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip {
  font-size: 11px; color: var(--dim); background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 0 8px;
}
.chip.role { color: var(--gold); border-color: #4a3c1e; }
.chip.var { font-family: var(--mono); }
.chip.untagged { border-style: dashed; color: var(--faint); }
.card .note { color: var(--dim); font-size: 12px; margin-top: 6px; }
.card .facts { display: flex; gap: 10px; margin-top: 6px; color: var(--faint);
               font-family: var(--mono); font-size: 11px; }

/* ---- cuts ---- */
.cut { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
       margin-bottom: 18px; overflow: hidden; }
.cut .head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
             padding: 10px 14px; border-bottom: 1px solid var(--border); }
.cut .head h2 { font-size: 14px; margin: 0; }
.cut .head .mono { color: var(--dim); }
.state { font-size: 11px; border-radius: 999px; padding: 1px 9px; border: 1px solid; }
.state.fresh { color: var(--fresh); border-color: #2c4a35; }
.state.stale { color: var(--stale); border-color: #4a3c1e; }
.state.none, .state.empty { color: var(--faint); border-color: var(--border); }
.cut .head .play { margin-left: auto; display: flex; gap: 8px; }
.cut .cnote { padding: 8px 14px 0; color: var(--dim); font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--faint); font-weight: 500; font-size: 11px;
     text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 4px; }
td { padding: 5px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--panel-2); }
td.n, td.t { font-family: var(--mono); font-size: 12px; color: var(--dim);
             white-space: nowrap; }
td img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px;
         display: block; background: #0d0f12; }
.badge { font-family: var(--mono); font-size: 11px; color: var(--stale);
         border: 1px solid #4a3c1e; border-radius: 4px; padding: 0 5px; }
tr.gone td { color: var(--faint); }

/* ---- quick note ---- */
#note {
  position: fixed; right: 16px; bottom: 16px; width: 320px; z-index: 20;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.5);
}
#note .nhead {
  display: flex; gap: 6px; align-items: center; padding: 6px 8px;
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim);
}
#note .nhead span { margin-right: auto; }
#note .nhead button { padding: 1px 8px; font-size: 12px; }
#note textarea {
  display: block; width: 100%; min-height: 96px; resize: vertical;
  border: none; background: transparent; color: var(--text);
  font-family: var(--mono); font-size: 12px; padding: 8px; outline: none;
}
.addnote { padding: 0 7px; font-size: 12px; line-height: 20px; white-space: nowrap; }

/* ---- preview overlay ---- */
#overlay {
  position: fixed; inset: 0; background: rgba(8,9,11,.82); display: none;
  align-items: flex-start; justify-content: center; padding: 4vh 16px; z-index: 10;
}
#overlay.open { display: flex; }
#panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  width: min(960px, 100%); max-height: 92vh; overflow-y: auto; padding: 14px;
}
#panel .top { display: flex; align-items: baseline; gap: 10px; }
#panel h3 { margin: 0; font-size: 15px; }
#panel .top .mono { color: var(--dim); }
#panel .close { margin-left: auto; }
#panel video { width: 100%; border-radius: 6px; background: #000; margin-top: 10px; }
#panel .ribbon { margin-top: 6px; border-radius: 2px; }
#panel .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
#panel .hint { color: var(--faint); font-size: 12px; }
#srcwrap { display: none; }
.navarrow {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 11;
  font-size: 26px; line-height: 1; padding: 12px 14px; border-radius: 8px;
}
#nav-prev { left: 14px; } #nav-next { right: 14px; }

@media (max-width: 640px) {
  header, nav, main { padding-left: 12px; padding-right: 12px; }
  #meta { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <h1>shot<span>pilot</span></h1>
  <div id="totals"></div>
  <div id="meta">
    <span id="stamp"></span>
    <button id="refresh">Refresh</button>
  </div>
</header>
<nav>
  <a href="#selects" data-tab="selects">Selects<b id="n-selects"></b></a>
  <a href="#cuts" data-tab="cuts">Cuts<b id="n-cuts"></b></a>
  <a href="#inputs" data-tab="inputs">Inputs<b id="n-inputs"></b></a>
</nav>
<main id="main"><div class="msg">Loading…</div></main>

<div id="overlay">
  <button id="nav-prev" class="navarrow" title="previous (←)" hidden>‹</button>
  <div id="panel"></div>
  <button id="nav-next" class="navarrow" title="next (→)" hidden>›</button>
</div>

<div id="note" hidden>
  <div class="nhead">
    <span>quick note</span>
    <button id="note-copy">Copy</button>
    <button id="note-clear">Clear</button>
    <button id="note-hide" title="hide (content stays)">×</button>
  </div>
  <textarea id="note-text" placeholder="clip names land here — add times, thoughts…"></textarea>
</div>

<script>
"use strict";
let DATA = null;
const $ = (sel, el) => (el || document).querySelector(sel);
const state = { q: "", stars: 0, rejected: "hide", sort: "order" }; // rejected: hide | show | only

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

const fmtS = s => s == null ? "?" : (s >= 60
  ? `${Math.floor(s / 60)}:${String((s % 60).toFixed(1)).padStart(4, "0")}`
  : `${(+s).toFixed(1)}s`);
const stem = f => f.split("/").pop().replace(/\.[^.]+$/, "");

function stars(n) {
  const el = h("span", { class: "stars" });
  for (let i = 1; i <= 5; i++)
    el.append(h("span", { class: i <= (n || 0) ? "" : "off" }, i <= (n || 0) ? "★" : "☆"));
  return el;
}

function ribbon(sel) {
  const src = DATA.inputs.find(i => i.file === sel.source);
  if (!src || !src.duration || !sel.range) return null;
  const l = (sel.range[0] / src.duration) * 100;
  const w = Math.max(((sel.range[1] - sel.range[0]) / src.duration) * 100, 0.8);
  return h("div", { class: "ribbon", title: `${sel.range[0]}–${sel.range[1]}s of ${fmtS(src.duration)} source` },
    h("i", { style: `left:${l}%;width:${w}%` }));
}

function tagChips(sel) {
  const t = sel.tags;
  if (!t) return [h("span", { class: "chip untagged" }, "untagged")];
  const out = ["scene", "shot", "light"].filter(k => t[k])
    .map(k => h("span", { class: "chip" }, t[k]));
  if (t.role) out.push(h("span", { class: "chip role" }, "+" + t.role));
  return out;
}

function thumbEl(sel) {
  return sel.exists
    ? h("img", { src: sel.thumb, loading: "lazy", alt: sel.label })
    : h("div", { class: "missing" }, "file missing");
}

/* ---------------------------------------------------------------- selects */
function viewSelects(main) {
  const sels = DATA.selects;
  if (!sels.length) {
    main.append(h("div", { class: "msg" }, "No selects yet — cut some with ", h("code", {}, "shot select"), "."));
    return;
  }
  const grid = h("div", { id: "grid" });
  const empty = h("div", { class: "msg" }, "Nothing matches the filter.");
  const count = h("span", { class: "count" });
  // re-render only the grid, so the search input keeps focus while typing
  const renderGrid = () => {
    const match = s => {
      if (state.rejected === "hide" && s.reject) return false;
      if (state.rejected === "only" && !s.reject) return false;
      if ((s.stars || 0) < state.stars) return false;
      if (!state.q) return true;
      const t = s.tags ? Object.values(s.tags).join(" ") : "";
      return `${s.label} ${s.source} ${t} ${s.notes || ""}`.toLowerCase().includes(state.q);
    };
    const shown = sels.filter(match);
    if (state.sort === "stars") shown.sort((a, b) => (b.stars || 0) - (a.stars || 0));
    else if (state.sort === "duration") shown.sort((a, b) => (b.duration_s || 0) - (a.duration_s || 0));
    grid.replaceChildren(...shown.map((s, i) => card(s, shown, i)));
    empty.style.display = shown.length ? "none" : "";
    count.textContent = shown.length === sels.length
      ? `${sels.length} selects` : `${shown.length} of ${sels.length}`;
  };
  main.append(h("div", { id: "filters" },
    h("input", { type: "search", placeholder: "Filter: label, source, tag…  ( / )", value: state.q,
      oninput: e => { state.q = e.target.value.toLowerCase(); renderGrid(); } }),
    h("select", { onchange: e => { state.stars = +e.target.value; renderGrid(); } },
      [0, 1, 2, 3, 4, 5].map(n => h("option", { value: n, selected: state.stars === n ? "" : null },
        n ? "★".repeat(n) + " and up" : "any stars"))),
    h("select", { onchange: e => { state.rejected = e.target.value; renderGrid(); } },
      [["hide", "hide rejected"], ["show", "include rejected"], ["only", "only rejected"]]
        .map(([v, t]) => h("option", { value: v, selected: state.rejected === v ? "" : null }, t))),
    h("select", { onchange: e => { state.sort = e.target.value; renderGrid(); } },
      [["order", "manifest order"], ["stars", "stars ↓"], ["duration", "duration ↓"]]
        .map(([v, t]) => h("option", { value: v, selected: state.sort === v ? "" : null }, t))),
    count));
  main.append(grid, empty);
  renderGrid();
}

function card(s, list, at) {
  const variants = Object.keys(s.speed_variants || {});
  return h("div", { class: "card" + (s.reject ? " reject" : ""),
      onclick: () => openNav(list, at, x => openPreview(x)) },
    h("div", { class: "ph" }, thumbEl(s),
      h("span", { class: "dur" }, fmtS(s.duration_s))),
    ribbon(s),
    h("div", { class: "body" },
      h("div", { class: "top" }, h("span", { class: "label" }, s.label), stars(s.stars),
        noteBtn(stem(s.file))),
      h("div", { class: "src" }, `${s.source_stem}  [${s.range[0]}–${s.range[1]}s]`),
      h("div", { class: "chips" }, tagChips(s),
        variants.map(v => h("span", { class: "chip var" }, "x" + v))),
      s.notes ? h("div", { class: "note" }, s.notes) : null,
      h("div", { class: "facts" },
        h("span", {}, s.pace_pct_s ? `pace ${s.pace_pct_s} %/s` : "pace ?"))));
}

/* ------------------------------------------------------------------- cuts */
function viewCuts(main) {
  const names = Object.keys(DATA.cuts);
  if (!names.length || names.every(n => !DATA.cuts[n].sequence_len)) {
    main.append(h("div", { class: "msg" }, "No sequences yet — arrange one with ", h("code", {}, "shot sequence"), "."));
    return;
  }
  const bySelect = Object.fromEntries(DATA.selects.map(s => [s.file, s]));
  for (const name of names) {
    const c = DATA.cuts[name];
    const r = c.render || { state: "none" };
    const target = c.target_s
      ? ` / target ${fmtS(c.target_s)} (Δ ${(c.sequence_s - c.target_s).toFixed(1)}s)` : "";
    const head = h("div", { class: "head" },
      h("h2", {}, name === "main" ? "main montage" : name),
      h("span", { class: "mono" }, `${c.sequence_len} clips · ${fmtS(c.sequence_s)}${target}`),
      h("span", { class: "state " + r.state, title: r.reason || "" },
        `render: ${r.state}${r.draft ? " (draft)" : ""}`),
      c.music && (c.music.tracks || c.music.applied.state !== "none")
        ? h("span", { class: "state " + c.music.applied.state, title: c.music.applied.reason || "" },
            `music: ${c.music.tracks} track${c.music.tracks === 1 ? "" : "s"}, applied ${c.music.applied.state}`)
        : null,
      h("div", { class: "play" },
        c.render_exists && c.render_url
          ? h("button", { onclick: () => openVideo(`${name} — render`, c.render_url) }, "▸ render") : null,
        c.final_url
          ? h("button", { onclick: () => openVideo(`${name} — with music`, c.final_url) }, "▸ final") : null));
    const cut = h("div", { class: "cut" }, head);
    if (c.notes) cut.append(h("div", { class: "cnote" }, "note: " + c.notes));
    if (c.sequence.length) {
      const rows = []; let at = 0;
      // prev/next in the preview walks the sequence (rows whose select is known)
      const navItems = c.sequence.filter(e => bySelect[e.select]);
      const navOpen = e => openPreview(bySelect[e.select], e.use);
      for (const e of c.sequence) {
        const sel = bySelect[e.select];
        const speed = sel && e.use !== sel.file
          ? Object.entries(sel.speed_variants || {}).find(([, v]) => v === e.use)?.[0] : null;
        rows.push(h("tr", { class: "row" + (e.use_exists ? "" : " gone"),
            onclick: () => sel ? openNav(navItems, navItems.indexOf(e), navOpen)
                               : (e.use_url && openVideo(stem(e.use), e.use_url)) },
          h("td", { class: "n" }, e.n),
          h("td", {}, sel && sel.exists ? h("img", { src: sel.thumb, loading: "lazy", alt: "" }) : null),
          h("td", {}, sel ? sel.label : stem(e.use),
            e.use_exists ? null : h("span", { class: "badge", style: "margin-left:8px" }, "missing")),
          h("td", {}, speed ? h("span", { class: "badge" }, "x" + speed) : null),
          h("td", { class: "t" }, fmtS(e.duration_s)),
          h("td", { class: "t" }, "@ " + fmtS(at)),
          h("td", {}, stars(e.stars)),
          h("td", {}, h("div", { class: "chips" }, tagChips({ tags: e.tags })))));
        at += e.duration_s || 0;
      }
      cut.append(h("table", {},
        h("thead", {}, h("tr", {}, ["#", "", "clip", "", "dur", "start", "stars", "tags"].map(t => h("th", {}, t)))),
        h("tbody", {}, rows)));
    }
    main.append(cut);
  }
}

/* ----------------------------------------------------------------- inputs */
const istate = { q: "", pick: "all" }; // pick: all | picked | skipped | unanalyzed

function inputRibbon(i) {
  const sels = DATA.selects.filter(s => s.source === i.file && s.range);
  if (!i.duration || !sels.length) return null;
  const rb = h("div", { class: "ribbon" });
  for (const s of sels)
    rb.append(h("i", { class: s.reject ? "bad" : null,
      title: `${s.label} [${s.range[0]}–${s.range[1]}s]`,
      style: `left:${(s.range[0] / i.duration) * 100}%;` +
             `width:${Math.max(((s.range[1] - s.range[0]) / i.duration) * 100, 0.8)}%` }));
  return rb;
}

function selectChips(i, klass) {
  return i.selects.map(f => {
    const sel = DATA.selects.find(s => s.file === f);
    return h("span", { class: klass, style: "cursor:pointer",
      onclick: e => { e.stopPropagation(); if (sel) openPreview(sel); } },
      sel ? sel.label : stem(f));
  });
}

function inputCard(i, list, at) {
  const skipped = i.analyzed && !i.selects.length;
  const warns = (i.warnings || []).length;
  return h("div", { class: "card" + (skipped ? " skipped" : ""),
      onclick: () => openNav(list, at, x => openInputPreview(x)) },
    h("div", { class: "ph" },
      i.exists ? h("img", { src: i.thumb, loading: "lazy", alt: i.stem })
               : h("div", { class: "missing" }, "source offline — SD card?"),
      i.duration ? h("span", { class: "dur" }, fmtS(i.duration)) : null),
    inputRibbon(i),
    h("div", { class: "body" },
      h("div", { class: "top" },
        h("span", { class: "label" }, i.stem),
        h("span", { class: "src" }, i.analyzed ? `kept ${i.kept_pct}%` : "not scanned"),
        noteBtn(i.stem)),
      h("div", { class: "chips" },
        selectChips(i, "chip role"),
        skipped ? h("span", { class: "chip untagged" }, "no selects") : null,
        warns ? h("span", { class: "chip warn", title: i.warnings.join("\n") }, `⚠ ${warns}`) : null),
      h("div", { class: "facts" },
        h("span", {}, i.file.split("/").pop()),
        i.contact_url ? h("a", { href: i.contact_url, target: "_blank",
          onclick: e => e.stopPropagation() }, "contact sheet") : null)));
}

function viewInputs(main) {
  const ins = DATA.inputs;
  if (!ins.length) {
    main.append(h("div", { class: "msg" },
      `No videos in ${DATA.input_dir}/ — SD card unplugged?`));
    return;
  }
  const grid = h("div", { id: "grid" });
  const empty = h("div", { class: "msg" }, "Nothing matches the filter.");
  const count = h("span", { class: "count" });
  const renderGrid = () => {
    const match = i => {
      if (istate.pick === "picked" && !i.selects.length) return false;
      if (istate.pick === "skipped" && !(i.analyzed && !i.selects.length)) return false;
      if (istate.pick === "unanalyzed" && i.analyzed) return false;
      return !istate.q || i.file.toLowerCase().includes(istate.q);
    };
    const shown = ins.filter(match);
    grid.replaceChildren(...shown.map((i, at) => inputCard(i, shown, at)));
    empty.style.display = shown.length ? "none" : "";
    count.textContent = shown.length === ins.length
      ? `${ins.length} inputs` : `${shown.length} of ${ins.length}`;
  };
  main.append(h("div", { id: "filters" },
    h("input", { type: "search", placeholder: "Filter: file name…  ( / )", value: istate.q,
      oninput: e => { istate.q = e.target.value.toLowerCase(); renderGrid(); } }),
    h("select", { onchange: e => { istate.pick = e.target.value; renderGrid(); } },
      [["all", "all inputs"], ["picked", "with selects"],
       ["skipped", "skipped (no selects)"], ["unanalyzed", "not scanned"]]
        .map(([v, t]) => h("option", { value: v, selected: istate.pick === v ? "" : null }, t))),
    count));
  main.append(grid, empty);
  renderGrid();
}

function openInputPreview(i) {
  const panel = panelShell(i.stem,
    i.analyzed ? `${fmtS(i.duration)} · kept ${i.kept_pct}%` : "not scanned");
  if (i.exists && i.url)
    panel.append(h("video", { controls: "", autoplay: "", preload: "metadata", src: i.url }));
  else
    panel.append(h("div", { class: "msg" }, "source offline — SD card?"));
  const rb = inputRibbon(i);
  if (rb) panel.append(rb);
  const row = h("div", { class: "row2" }, h("div", { class: "chips" }, selectChips(i, "chip role")));
  if (i.analyzed && !i.selects.length)
    row.append(h("span", { class: "hint" }, "no selects cut from this input"));
  if (i.contact_url)
    row.append(h("a", { href: i.contact_url, target: "_blank" }, "contact sheet"));
  row.append(noteBtn(i.stem, "✎ add to note"));
  panel.append(row);
  for (const w of i.warnings || [])
    panel.append(h("div", { class: "row2 hint" }, "⚠ " + w));
  if (/\.(mts|mkv|avi)$/.test(i.file.toLowerCase()))
    panel.append(h("div", { class: "row2 hint" }, "source format may not play in-browser"));
}

/* ------------------------------------------------------------- quick note */
const noteBox = $("#note"), noteText = $("#note-text");
noteText.value = localStorage.getItem("shotpilot-note") || "";
noteBox.hidden = !noteText.value;
noteText.addEventListener("input",
  () => localStorage.setItem("shotpilot-note", noteText.value));

function addToNote(name) {
  const sep = noteText.value && !noteText.value.endsWith("\n") ? "\n" : "";
  noteText.value += sep + name + " ";
  localStorage.setItem("shotpilot-note", noteText.value);
  noteBox.hidden = false;
  noteText.focus(); // caret at the end — type the time range right away
  noteText.setSelectionRange(noteText.value.length, noteText.value.length);
  noteText.scrollTop = noteText.scrollHeight;
}

function noteBtn(name, label) {
  return h("button", { class: "addnote", title: "add to note",
    onclick: e => { e.stopPropagation(); addToNote(name); } }, label || "✎+");
}

$("#note-copy").addEventListener("click", async e => {
  try { await navigator.clipboard.writeText(noteText.value); }
  catch { noteText.select(); document.execCommand("copy"); }
  const b = e.target;
  b.textContent = "Copied!"; setTimeout(() => { b.textContent = "Copy"; }, 900);
});
$("#note-clear").addEventListener("click", () => {
  noteText.value = ""; localStorage.removeItem("shotpilot-note");
});
$("#note-hide").addEventListener("click", () => { noteBox.hidden = true; });

/* ---------------------------------------------------------------- preview */
/* prev/next within the list the preview was opened from (filtered gallery
   or cut sequence); anything opened outside a list has no arrows */
let nav = null; // { items, index, open }

function updateArrows() {
  $("#nav-prev").hidden = !nav || nav.index <= 0;
  $("#nav-next").hidden = !nav || nav.index >= nav.items.length - 1;
}

function openNav(items, index, open) {
  open(items[index]); // panelShell clears nav — set it after
  nav = { items, index, open };
  updateArrows();
}

function navStep(d) {
  if (!nav) return;
  const i = nav.index + d;
  if (i >= 0 && i < nav.items.length) openNav(nav.items, i, nav.open);
}

function closePreview() {
  for (const v of document.querySelectorAll("#panel video")) { v.pause(); v.removeAttribute("src"); v.load(); }
  $("#overlay").classList.remove("open");
  nav = null;
  updateArrows();
}

function panelShell(title, sub) {
  const panel = $("#panel");
  nav = null;
  updateArrows();
  panel.replaceChildren(h("div", { class: "top" },
    h("h3", {}, title), sub ? h("span", { class: "mono" }, sub) : null,
    h("button", { class: "close", onclick: closePreview }, "Close")));
  $("#overlay").classList.add("open");
  return panel;
}

function openVideo(title, url) {
  const panel = panelShell(title);
  panel.append(h("video", { controls: "", autoplay: "", preload: "metadata", src: url }));
}

function openPreview(sel, use) {
  const url = use && use !== sel.file
    ? (Object.entries(sel.speed_variants || {}).find(([, v]) => v === use)
        ? sel.speed_variant_urls[Object.entries(sel.speed_variants).find(([, v]) => v === use)[0]]
        : sel.url)
    : sel.url;
  const panel = panelShell(sel.label, `${sel.source_stem} [${sel.range[0]}–${sel.range[1]}s]`);
  if (sel.exists && url) panel.append(h("video", { controls: "", autoplay: "", preload: "metadata", src: url }));
  else panel.append(h("div", { class: "msg" }, "select file missing on disk"));
  const rb = ribbon(sel);
  if (rb) panel.append(rb);
  const row = h("div", { class: "row2" });
  for (const [k, u] of Object.entries(sel.speed_variant_urls || {}))
    if (u) row.append(h("button", { onclick: () => swapVideo(panel, u) }, `play x${k}`));
  if (sel.url) row.append(h("button", { onclick: () => swapVideo(panel, sel.url) }, "play original"));
  if (sel.source_exists && sel.source_url) {
    row.append(h("button", { onclick: () => toggleSource(panel, sel) }, `Open source at ${sel.range[0]}s`));
  } else {
    row.append(h("span", { class: "hint" }, "source offline — SD card?"));
  }
  row.append(noteBtn(stem(sel.file), "✎ add to note"));
  panel.append(row);
  if (sel.notes) panel.append(h("div", { class: "row2 hint" }, sel.notes));
  const lower = sel.source.toLowerCase();
  if (/\.(mts|mkv|avi)$/.test(lower))
    panel.append(h("div", { class: "row2 hint" }, "source format may not play in-browser"));
  panel.append(h("div", { id: "srcwrap" }));
}

function swapVideo(panel, url) {
  const v = $("video", panel);
  if (v) { v.src = url; v.play(); }
}

function toggleSource(panel, sel) {
  const wrap = $("#srcwrap", panel);
  if (wrap.style.display === "block") { wrap.style.display = "none"; return; }
  wrap.style.display = "block";
  if (!$("video", wrap)) {
    const v = h("video", { controls: "", preload: "metadata",
                           src: sel.source_url + "#t=" + sel.range[0] });
    wrap.replaceChildren(
      h("div", { class: "row2" },
        h("span", { class: "hint" }, "source: " + sel.source),
        h("button", { onclick: () => { v.currentTime = sel.range[0]; v.play(); } }, `⇤ ${sel.range[0]}s`),
        h("button", { onclick: () => { v.currentTime = sel.range[1]; } }, `${sel.range[1]}s ⇥`)),
      v);
  }
}

/* ----------------------------------------------------------------- render */
function render() {
  const tab = (location.hash || "#selects").slice(1);
  for (const a of document.querySelectorAll("nav a"))
    a.classList.toggle("active", a.dataset.tab === tab);
  const main = $("#main");
  main.replaceChildren();
  if (!DATA) { main.append(h("div", { class: "msg" }, "Loading…")); return; }
  ({ selects: viewSelects, cuts: viewCuts, inputs: viewInputs }[tab] || viewSelects)(main);
}

async function load() {
  try {
    const res = await fetch("/api/status");
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    DATA = await res.json();
  } catch (e) {
    $("#main").replaceChildren(h("div", { class: "msg" }, "Cannot load /api/status — " + e.message));
    return;
  }
  const t = DATA.totals;
  $("#totals").textContent =
    `${t.analyzed}/${t.inputs} analyzed · ${t.selects} selects (${fmtS(t.selects_total_s)}) · ${t.tagged} tagged` +
    (t.rejected ? ` · ${t.rejected} rejected` : "");
  $("#stamp").textContent = DATA.generated_at.replace("T", " ");
  $("#n-selects").textContent = t.selects;
  $("#n-cuts").textContent = Object.values(DATA.cuts).filter(c => c.sequence_len).length;
  $("#n-inputs").textContent = t.inputs;
  render();
}

$("#refresh").addEventListener("click", load);
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closePreview(); });
$("#nav-prev").addEventListener("click", () => navStep(-1));
$("#nav-next").addEventListener("click", () => navStep(1));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePreview(); return; }
  if (!e.target.matches("input, select, textarea, video") &&
      $("#overlay").classList.contains("open")) {
    if (e.key === "ArrowLeft") { e.preventDefault(); navStep(-1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); navStep(1); return; }
  }
  if (e.key === "/" && !e.target.matches("input, select, textarea, video")) {
    const search = $("#filters input"); // selects tab only
    if (search) { e.preventDefault(); search.focus(); }
  }
});
window.addEventListener("hashchange", render);
load();
</script>
</body>
